<nav class="navbar navbar-expand-lg app-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/home" (click)="closeMenus()">
      <span class="brand-badge"><i class="bi bi-buildings-fill"></i></span>
      <span>Rent<em>Hub</em></span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="menuOpen()"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuOpen()">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active" (click)="closeMenus()">
            Home
          </a>
        </li>
        @if (currentUser(); as user) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/listings/new" (click)="closeMenus()">Post Property</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/profile" (click)="closeMenus()">My Account</a>
          </li>
        }
      </ul>

      <div class="d-flex align-items-center gap-2 flex-wrap">
        @if (currentUser(); as user) {
          <div class="dropdown">
            <button
              class="btn user-chip dropdown-toggle"
              type="button"
              (click)="toggleUserMenu()"
              [attr.aria-expanded]="userMenuOpen()"
            >
              <span class="avatar">{{ initials }}</span>
              <span class="d-none d-md-inline">{{ user.name }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end" [class.show]="userMenuOpen()">
              <li>
                <a class="dropdown-item" routerLink="/profile" (click)="closeMenus()">
                  <i class="bi bi-person me-2"></i>Profile
                </a>
              </li>
              <li>
                <a class="dropdown-item" routerLink="/profile" [queryParams]="{ tab: 'favorites' }" (click)="closeMenus()">
                  <i class="bi bi-heart me-2"></i>Favourites
                </a>
              </li>
              <li><hr class="dropdown-divider" /></li>
              <li>
                <button class="dropdown-item" type="button" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
              </li>
            </ul>
          </div>
        } @else {
          <a class="btn btn-outline-light" routerLink="/login" (click)="closeMenus()">Login</a>
          <a class="btn btn-accent" routerLink="/register" (click)="closeMenus()">Register</a>
        }
      </div>
    </div>
  </div>
</nav>
